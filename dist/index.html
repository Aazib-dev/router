<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="./icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity Router</title>
  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem('app-theme-preference');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const shouldBeDark = savedTheme === 'dark' || ((!savedTheme || savedTheme === 'system') && systemDark);

        const bgColor = shouldBeDark ? '#09090b' : '#F8FAFC';
        document.documentElement.style.backgroundColor = bgColor;

        if (shouldBeDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {
        document.documentElement.style.backgroundColor = '#F8FAFC';
      }
    })();
  </script>

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      -webkit-font-smoothing: antialiased;
